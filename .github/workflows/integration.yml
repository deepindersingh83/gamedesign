name: Integration (PrestaShop)

# Boots a real PrestaShop + MySQL, installs every itstore* module onto the
# stock classic theme (which fires the same hooks our modules use), and
# smoke-tests the home page, a product page and the module front controllers.
# This turns the static lint checks into a genuine install/runtime test.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  install-and-smoke:
    name: Install modules + smoke test
    runs-on: ubuntu-latest
    env:
      # PrestaShop image tag. 9.1 is the target; override here if a newer
      # patch tag is published (e.g. 9.1.0). Falls back to 9.0 automatically.
      PS_TAG: "9.1"
      PS_FALLBACK_TAG: "9.0"
      DB_PASSWD: ps_ci_pw
      ADMIN_MAIL: admin@itstore.test
      ADMIN_PASSWD: itstore-ci-123
      BASE_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - name: Create docker network
        run: docker network create psnet

      - name: Start MySQL
        run: |
          docker run -d --name psdb --network psnet \
            -e MYSQL_ROOT_PASSWORD="$DB_PASSWD" \
            -e MYSQL_DATABASE=prestashop \
            mysql:8.0 --default-authentication-plugin=mysql_native_password
          echo "Waiting for MySQL..."
          for i in $(seq 1 60); do
            if docker exec psdb mysqladmin ping -uroot -p"$DB_PASSWD" --silent 2>/dev/null; then
              echo "MySQL up"; break
            fi
            sleep 3
          done

      - name: Resolve PrestaShop image tag
        id: img
        run: |
          tag="prestashop/prestashop:${PS_TAG}"
          if docker manifest inspect "$tag" >/dev/null 2>&1; then
            echo "Using $tag"
          else
            tag="prestashop/prestashop:${PS_FALLBACK_TAG}"
            echo "Tag ${PS_TAG} unavailable, falling back to $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Start PrestaShop (auto-install)
        run: |
          # NB: no PS_ERASE_DB — the MySQL service already created an empty
          # `prestashop` DB; erasing would drop it and the installer then fails
          # with "Unknown database 'prestashop'".
          # NB: no PS_FOLDER_ADMIN — renaming the admin folder makes the 9.1
          # image's finalize step ("assets:install admin-dev") fail because the
          # folder it expects no longer exists. Keep the default admin folder.
          docker run -d --name psweb --network psnet -p 8080:80 \
            -e DB_SERVER=psdb \
            -e DB_NAME=prestashop \
            -e DB_USER=root \
            -e DB_PASSWD="$DB_PASSWD" \
            -e PS_INSTALL_AUTO=1 \
            -e PS_DEV_MODE=1 \
            -e PS_DEMO_MODE=0 \
            -e PS_DOMAIN=localhost:8080 \
            -e PS_ENABLE_SSL=0 \
            -e PS_FOLDER_INSTALL=install \
            -e ADMIN_MAIL="$ADMIN_MAIL" \
            -e ADMIN_PASSWD="$ADMIN_PASSWD" \
            "${{ steps.img.outputs.tag }}"

      - name: Wait for install to finish
        run: |
          echo "Waiting for PrestaShop front office..."
          ok=0
          for i in $(seq 1 100); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/" || true)
            if [ "$code" = "200" ]; then ok=1; echo "Front office up (HTTP 200)"; break; fi
            sleep 6
          done
          if [ "$ok" != "1" ]; then
            echo "PrestaShop did not come up in time"; docker logs psweb | tail -80; exit 1
          fi

      - name: Copy modules into the container
        run: |
          for d in modules/itstore*; do
            name=$(basename "$d")
            docker cp "$d" "psweb:/var/www/html/modules/$name"
          done
          docker cp themes/itstore psweb:/var/www/html/themes/itstore
          docker exec psweb chown -R www-data:www-data /var/www/html/modules /var/www/html/themes

      - name: Install every itstore* module
        run: |
          set -e
          fail=0
          for d in modules/itstore*; do
            name=$(basename "$d")
            echo "::group::install $name"
            if docker exec -u www-data psweb php -d memory_limit=-1 bin/console prestashop:module install "$name"; then
              echo "installed $name"
            else
              echo "::error::module $name failed to install"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Smoke-test front office pages
        run: |
          set -e
          check() {
            local label="$1"; local url="$2"
            local body; body=$(mktemp)
            local code; code=$(curl -s -o "$body" -w '%{http_code}' "$url" || true)
            echo "-- $label -> HTTP $code ($url)"
            if [ "${code:0:1}" = "5" ] || [ "$code" = "000" ]; then
              echo "::error::$label returned $code"; tail -c 1200 "$body"; return 1
            fi
            if grep -qiE 'Fatal error|Uncaught|There has been an error|Whoops, looks like something went wrong' "$body"; then
              echo "::error::$label page contains a PHP error"; grep -iE 'Fatal error|Uncaught|error' "$body" | head; return 1
            fi
            return 0
          }
          rc=0
          check "Home (displayHome hooks)"            "$BASE_URL/" || rc=1
          check "Product (product-page hooks)"        "$BASE_URL/index.php?controller=product&id_product=1" || rc=1
          check "PC builder controller"               "$BASE_URL/index.php?fc=module&module=itstorepcbuilder&controller=builder" || rc=1
          check "Compare controller"                  "$BASE_URL/index.php?fc=module&module=itstorecompare&controller=compare&ids=1,2" || rc=1
          check "Category listing (quickview/compare)" "$BASE_URL/index.php?controller=category&id_category=2" || rc=1
          exit $rc

      - name: Dump PrestaShop logs on failure
        if: failure()
        run: |
          echo "==== container logs ===="; docker logs psweb | tail -120 || true
          echo "==== app logs ===="
          docker exec psweb sh -c 'tail -n 120 var/logs/*.log 2>/dev/null' || true
