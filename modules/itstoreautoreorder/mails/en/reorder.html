<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Time to reorder</title></head>
<body style="font-family:Arial,Helvetica,sans-serif;background:#f6f7fb;margin:0;padding:24px;color:#0b1220;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e3e7ef;">
    <tr><td style="background:#0b1220;color:#fff;padding:20px 24px;font-size:20px;font-weight:bold;">{shop_name}</td></tr>
    <tr><td style="padding:24px;">
      <h1 style="font-size:20px;margin:0 0 12px;">Time to reorder, {firstname}!</h1>
      <p style="font-size:15px;color:#5a6478;margin:0 0 20px;">
        Your subscription for <strong>{product}</strong> is due. Reorder in a couple of clicks — your Subscribe &amp; Save discount still applies.
      </p>
      <p style="margin:0 0 8px;">
        <a href="{url}" style="display:inline-block;background:#2f6fed;color:#fff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:bold;">Reorder now</a>
      </p>
    </td></tr>
    <tr><td style="padding:16px 24px;border-top:1px solid #eef0f4;font-size:12px;color:#8b94a8;">
      You’re receiving this because you subscribed to auto-reorder. Manage or cancel anytime from your account.
    </td></tr>
  </table>
</body>
</html>
