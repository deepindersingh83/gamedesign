<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Back in stock</title></head>
<body style="font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;margin:0;padding:24px;color:#0f172a;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;">
    <tr><td style="background:#0b1f33;color:#ffffff;padding:20px 24px;font-size:20px;font-weight:bold;">
      {shop_name}
    </td></tr>
    <tr><td style="padding:24px;">
      <h1 style="font-size:20px;margin:0 0 12px;">Good news — it's back in stock!</h1>
      <p style="font-size:15px;color:#475569;margin:0 0 20px;">
        The product you were waiting for, <strong>{product}</strong>, is available again.
        Stock can move fast, so grab yours while it lasts.
      </p>
      <p style="margin:0 0 8px;">
        <a href="{url}" style="display:inline-block;background:#1f6feb;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:bold;">View product</a>
      </p>
    </td></tr>
    <tr><td style="padding:16px 24px;border-top:1px solid #eef2f7;font-size:12px;color:#8aa0bb;">
      You received this email because you asked to be notified when this item returned to stock.
    </td></tr>
  </table>
</body>
</html>
