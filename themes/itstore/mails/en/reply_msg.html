<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{shop_name}</title>
</head>
<body style="margin:0;padding:0;background:#f6f7fb;font-family:Arial,Helvetica,sans-serif;color:#3c485f;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f6f7fb;padding:24px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #e3e7ef;border-radius:14px;overflow:hidden;">
          <tr>
            <td style="background:#0b1220;padding:20px 28px;">
              <span style="color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:-.4px;">IT&nbsp;<span style="color:#7fa3f5;">Store</span></span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <h1 style="margin:0 0 6px;font-size:18px;color:#0b1220;">Hello {firstname} {lastname},</h1>
              <p style="margin:0 0 18px;font-size:14px;line-height:1.6;color:#5a6478;">Our team has replied to your message:</p>
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f6f7fb;border:1px solid #e3e7ef;border-radius:10px;">
                <tr><td style="padding:16px 18px;font-size:14px;line-height:1.7;color:#0b1220;">{message}</td></tr>
              </table>
              <p style="margin:20px 0 0;font-size:13px;line-height:1.6;color:#8b94a8;">If you have any further questions, simply reply to this email.</p>
            </td>
          </tr>
          <tr>
            <td style="background:#f6f7fb;padding:18px 28px;border-top:1px solid #e3e7ef;">
              <p style="margin:0;font-size:12px;color:#8b94a8;">&copy; {shop_name} &mdash; <a href="{shop_url}" style="color:#2f6fed;text-decoration:none;">{shop_url}</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
