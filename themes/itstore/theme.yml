name: itstore
display_name: "IT Store"
version: 1.0.0
parent: classic
author:
  name: "Syber Info"
  email: "admin@syberinfo.com.au"
  url: "https://syberinfo.com.au"

meta:
  compatibility:
    from: 1.7.6.0
    to: 9.99.99
  available_layouts:
    layout-full-width:
      name: "Full Width"
      description: "No side columns, ideal for homepages and landing pages"
    layout-both-columns:
      name: "Three Columns"
      description: "Two side columns"
    layout-left-column:
      name: "Two Columns, small left column"
      description: "One left column"
    layout-right-column:
      name: "Two Columns, small right column"
      description: "One right column"

assets:
  use_parent_assets: true

global_settings:
  configuration:
    PS_IMAGE_QUALITY: png
  modules:
    to_enable:
      - ps_imageslider
      - ps_banner
      - ps_categorytree
      - ps_customeraccountlinks
      - ps_featuredproducts
      - ps_linklist
      - ps_mainmenu
      - ps_searchbar
      - ps_shoppingcart
      - ps_customtext
      - ps_contactinfo
      - ps_emailsubscription
      - ps_facetedsearch
      - ps_sharebuttons
      - itstoreimageslot
      - itstoresupport
      - itstoretrustbar
      - itstorecategoriesblock
      - itstoredeals
      - itstorebrands
      - itstoremegamenu
      - itstorepcbuilder
      - itstorecompare
      - itstorequickview
      - itstorespecsheet
      - itstorereviews
      - itstorefinance
      - itstorestock
      - itstorewarranty
      - itstorebundles
      - itstorehero
      - itstorefleetdeals
      - itstorestats
      - itstoretestimonials
      - itstoreblog
      - itstorebulkpricing
      - itstoreautoreorder
      - itstoreaskquestion
      - itstoreseo
      - itstoretopbar
      - itstoreordertrack
      - itstorerecent

  hooks:
    modules_to_hook:
      displayHeader:
        - itstoreseo
        - ps_searchbar
        - ps_shoppingcart
        - ps_customeraccountlinks
      displayNav1:
        - itstoretopbar
        - ps_contactinfo
      displayNav2:
        - ps_customeraccountlinks
        - ps_shoppingcart
      displayTop:
        - ps_mainmenu
        - itstoremegamenu
      displayWrapperTop:
        - itstoretrustbar
      displayHome:
        - itstorehero
        - itstorecategoriesblock
        - itstorefleetdeals
        - ps_featuredproducts
        - itstoredeals
        - itstorestats
        - itstoretestimonials
        - itstorebrands
        - itstoreblog
        - itstorerecent
        - itstorepcbuilder
        - ps_banner
        - ps_customtext
      displayProductAdditionalInfo:
        - itstorestock
        - itstorebulkpricing
        - itstoreautoreorder
        - itstorefinance
        - itstorewarranty
      displayProductExtraContent:
        - itstorespecsheet
        - itstorereviews
        - itstoreaskquestion
      displayFooterProduct:
        - itstorebundles
        - itstorerecent
      displayProductListReviews:
        - itstorequickview
        - itstorecompare
      displayFooterBefore:
        - ps_emailsubscription
      displayFooter:
        - ps_linklist
        - ps_customtext
        - ps_contactinfo
      displayFooterAfter:
        - itstoresupport

  image_types:
    cart_default:
      width: 125
      height: 125
      scope:
        - products
    small_default:
      width: 98
      height: 98
      scope:
        - products
        - categories
        - manufacturers
        - suppliers
        - stores
    medium_default:
      width: 452
      height: 452
      scope:
        - products
        - manufacturers
        - suppliers
    home_default:
      width: 500
      height: 500
      scope:
        - products
    large_default:
      width: 800
      height: 800
      scope:
        - products
        - manufacturers
        - suppliers
    category_default:
      width: 141
      height: 180
      scope:
        - categories
    stores_default:
      width: 170
      height: 115
      scope:
        - stores

theme_settings:
  default_layout: layout-full-width
  layouts:
    category: layout-left-column
    best-sales: layout-left-column
    new-products: layout-left-column
    prices-drop: layout-left-column
    manufacturer: layout-left-column
    supplier: layout-left-column
    search: layout-left-column
